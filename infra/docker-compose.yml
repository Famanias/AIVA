

# =============================================================================
# AIVA — Local Development Stack
# Phase 1: Single-VPS docker-compose deployment
#
# Services:
#   redis           — BullMQ queue backing store
#   workers         — Python FastAPI (agents, TTS, B-roll, FFmpeg)
#   template-renderer — Node.js Remotion + Puppeteer worker
#   web             — Next.js frontend + API
#
# Database: External (managed Supabase) — not included here.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker-compose up --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Redis — Queue and cache backing store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Python Worker — Agent chain, TTS, B-roll, FFmpeg composition
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: ../apps/workers
      dockerfile: Dockerfile
    container_name: aiva-workers
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Shared storage for in-flight render artifacts
      - render_tmp:/app/storage/tmp
      # Model weight cache — avoids re-downloading on restart
      - model_cache:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # GPU reservation is optional — remove the 'deploy' section if no GPU available.
    # The workers fall back to CPU-based inference automatically.

  # ---------------------------------------------------------------------------
  # Template Renderer — Node.js Remotion + Puppeteer
  # ---------------------------------------------------------------------------
  template-renderer:
    build:
      context: ../apps/template-renderer
      dockerfile: Dockerfile
    container_name: aiva-template-renderer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - render_tmp:/app/output
    # Chromium is pre-baked into the image; no additional browser install needed.

  # ---------------------------------------------------------------------------
  # Web Application — Next.js 16 frontend + API layer
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: aiva-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_API_URL=http://workers:8000
      - TEMPLATE_RENDERER_URL=http://template-renderer:3001

volumes:
  redis_data:
  render_tmp:
  model_cache:
