

# =============================================================================
# AIVA — Local Development & Self-Hosted Stack
#
# Core Backing Services:
#   postgres        — Standalone PostgreSQL 16 with pgvector extension
#   redis           — BullMQ queue and cache backing store
# Application Services (optional containerized deployment):
#   workers         — Python FastAPI (agents, TTS, B-roll, FFmpeg)
#   template-renderer — Node.js Remotion + Puppeteer worker
#   web             — Next.js frontend + API
#
# Usage:
#   1. Start DB & Queue: pnpm services:up  (or docker compose -f infra/docker-compose.yml up -d postgres redis)
#   2. Apply Migrations: pnpm db:migrate
#   3. Run Local Dev:    pnpm dev
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary local relational database with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiva-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiva"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Queue and cache backing store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Python Worker — Agent chain, TTS, B-roll, FFmpeg composition
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: ../apps/workers
      dockerfile: Dockerfile
    container_name: aiva-workers
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aiva
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aiva
      - APP_SECRET=aiva_default_local_master_secret_2026
    volumes:
      - ../storage:/app/storage
      - model_cache:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Template Renderer — Node.js Remotion + Puppeteer
  # ---------------------------------------------------------------------------
  template-renderer:
    build:
      context: ..
      dockerfile: apps/template-renderer/Dockerfile
    container_name: aiva-template-renderer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aiva
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aiva
      - APP_SECRET=aiva_default_local_master_secret_2026
    volumes:
      - ../storage:/app/storage

  # ---------------------------------------------------------------------------
  # Web Application — Next.js 16 frontend + API layer
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: aiva-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aiva
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aiva
      - APP_SECRET=aiva_default_local_master_secret_2026
      - WORKER_API_URL=http://workers:8000
      - TEMPLATE_RENDERER_URL=http://template-renderer:3001
    volumes:
      - ../storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  model_cache:

